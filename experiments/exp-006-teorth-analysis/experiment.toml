# xLaDe Experiment Descriptor Template

# --- [required core] ---

id = "EXP-006"
name = "Lean Companion to Analysis I"
type = "script-policy"              
status = "active"                   
allowed_modes = ["experimental"]    
lean_toolchain = "leanprover/lean4:v4.29.0-rc8"
entry = "scripts/experiments/run-exp-006.sh"

# --- [about experiment] ---

description = "Terence Tao's Lean 4 formalization of his textbook Analysis I"
notes = "Environment of lake and elan has updated since then, so interesting to see if it is successful or not"
scope = "repository"
enforcement = "script"

# --- [provenance] ---

[provenance]
created = "2026-08-04"
author = "Lakshit Singh Bisht"

# --- [setup] ---

[setup]
project_repo = "https://github.com/teorth/analysis"
project_owner = "Terence Tao (teorth)"
project_submodule = "experiments/exp-006-teorth-analysis/analysis/"
project_ref = "ffa7001c354ac8dbb3d8d3a6830be7d8a3d4daad"
template = "external-lake-project"

[environment]
lake = "Lake version 5.0.0-src+f3b06c7 (Lean version 4.32.2)"
elan = "elan 4.2.3 (b6cec7e10 2026-06-08)"

[compatibility]
expected_to_work = ["leanprover/lean4:v4.29.0-rc8"]

[policy]
success_criteria = "compilation"
