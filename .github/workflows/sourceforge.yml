name: SourceForge Mirror (new)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror to SourceForge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mirrors

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Trust SourceForge host key
        shell: bash
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -t ed25519 git.code.sf.net > "$RUNNER_TEMP/sourceforge_host_key"

          expected="SHA256:vDwNztsrZFViJXWpUTSKGo8cF6n79iKAURNiK68n/yE"
          actual="$(ssh-keygen -lf "$RUNNER_TEMP/sourceforge_host_key" | awk '{print $2}')"

          if [ "$actual" != "$expected" ]; then
            echo "::error::SourceForge host key mismatch: got '$actual', expected '$expected'"
            exit 1
          fi

          cp "$RUNNER_TEMP/sourceforge_host_key" ~/.ssh/known_hosts

      - name: Push to SourceForge
        shell: bash
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          set -eu

          umask 077
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > ~/.ssh/id_ed25519

          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"

          git remote add sourceforge ssh://lakshitsbishttm@git.code.sf.net/p/xlade/code
          git push sourceforge HEAD:main
