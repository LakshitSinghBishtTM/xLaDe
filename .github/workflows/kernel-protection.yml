name: Kernel Protection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Kernel boundary check
        env:
          KERNEL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/experiments/check-kernel.sh
