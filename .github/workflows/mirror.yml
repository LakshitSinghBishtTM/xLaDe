name: Mirrors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror to GitLab, Codeberg, Bitbucket and Gitea
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mirrors

    steps:
      - name: Clone GitHub source
        id: clone
        shell: bash
        run: |
          set -eu

          git clone --mirror https://github.com/LakshitSinghBishtTM/xLaDe.git
          cd xLaDe.git

          git for-each-ref --format="%(refname)" refs/pull/ | while read -r ref; do
            git update-ref -d "$ref"
          done

      - name: Push to GitLab
        if: ${{ !cancelled() && steps.clone.outcome == 'success' }}
        shell: bash
        working-directory: xLaDe.git
        env:
          GIT_TERMINAL_PROMPT: "0"
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: git push --mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.com/LakshitSinghBishtTM/xLaDe.git"

      - name: Push to Codeberg
        if: ${{ !cancelled() && steps.clone.outcome == 'success' }}
        shell: bash
        working-directory: xLaDe.git
        env:
          GIT_TERMINAL_PROMPT: "0"
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push --mirror "https://oauth2:${CODEBERG_TOKEN}@codeberg.org/lakshitsinghbishttm/xLaDe.git"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Codeberg mirror push failed on attempt ${attempt}/3. Retrying in 15s..."
              sleep 15
            fi
          done
          echo "Codeberg mirror push failed after 3 attempts."
          exit 1

      - name: Push to Bitbucket
        if: ${{ !cancelled() && steps.clone.outcome == 'success' }}
        shell: bash
        working-directory: xLaDe.git
        env:
          GIT_TERMINAL_PROMPT: "0"
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
        run: git push --mirror "https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/lakshitsinghbishttm/xlade.git"

      - name: Push to Gitea
        if: ${{ !cancelled() && steps.clone.outcome == 'success' }}
        shell: bash
        working-directory: xLaDe.git
        env:
          GIT_TERMINAL_PROMPT: "0"
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: git push --mirror "https://${GITEA_TOKEN}@gitea.com/LakshitSinghBishtTM/xLaDe.git"