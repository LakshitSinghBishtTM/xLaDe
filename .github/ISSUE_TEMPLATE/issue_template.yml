name: xLaDe Issue
description: Helps in creating an issue easily
title: "[Issue Type]: "
labels: []
assignees: []

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: |
        Describe the issue you are experiencing.
        Please tell the issue you have. Don't report non-xLaDe issues. We may not be able to help you.
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Type of Issue
      options:
        - Bug
        - Feature Request
        - Documentation
        - Infrastructure
        - Ecosystem level
        - Other
    validations:
      required: true

  - type: markdown
    attributes:
      value: Environment

  - type: input
    id: xlade-version
    attributes:
      label: xLaDe
      placeholder: "x.y.z"
    validations:
      required: true

  - type: input
    id: lean-version
    attributes:
      label: Lean 4
      placeholder: "x.y.z"
    validations:
      required: false

  - type: input
    id: lake-version
    attributes:
      label: Lake
      placeholder: "x.y.z"
    validations:
      required: false

  - type: input
    id: elan-version
    attributes:
      label: Elan
      placeholder: "x.y.z"
    validations:
      required: false

  - type: input
    id: other-environment
    attributes:
      label: Other
      placeholder: Other relevant tools versions if applicable.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      placeholder: Please provide reproduction steps, expected outcome, logs, or any useful information if applicable.
    validations:
      required: false

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      placeholder: Anything else you would like to comment.
    validations:
      required: false